name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node checks and asset build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate same-origin Pixi bundle
        run: npm run renderer:vendor

      - name: Run checks
        run: npm run check

      - name: Rebuild and validate assets
        run: npm run assets:build

  container-build:
    name: Build and validate containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and web images
        run: docker compose build --pull api web

      - name: Apply reference migration
        run: docker compose --profile init run --rm migrate

      - name: Tear down integration services
        if: always()
        run: docker compose down -v
