<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173b2c" />
    <meta name="description" content="MO Farm — bản thử nghiệm nông trại" />
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
    <title>MO Farm — Nông trại</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <!-- The pinned Pixi bundle is generated by `npm run renderer:vendor` (and
         during the web image build). If absent, the shell keeps Canvas fallback. -->
    <script type="importmap">
      {
        "imports": {
          "pixi.js": "./public/vendor/pixi.mjs"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script>
      // Có thể ghi đè khi deploy: window.__MO_FARM_CONFIG__ = { apiBaseUrl: 'https://api.example' };
      window.__MO_FARM_CONFIG__ = window.__MO_FARM_CONFIG__ || {
        apiBaseUrl: '',
        assetBase: './public/assets',
      };
    </script>
    <script type="module" src="./src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { scope: './' }));
      }
    </script>
  </body>
</html>
