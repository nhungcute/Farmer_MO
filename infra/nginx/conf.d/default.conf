server {
  listen 80;
  server_name _;
  client_max_body_size 256k;
  # The edge owns this header; do not duplicate the web server's copy.
  proxy_hide_header X-Content-Type-Options;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Strict-Transport-Security $strict_transport_security always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"nginx"}';
  }
  location /api/ {
    proxy_pass http://mo_farm_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id_value;
    proxy_read_timeout 30s;
  }
  location / {
    proxy_pass http://mo_farm_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id_value;
  }
}
