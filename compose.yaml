name: mo-farm

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mo_farm}
      POSTGRES_USER: ${POSTGRES_USER:-mo_farm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - mo_farm_db:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEMO_MODE: ${DEMO_MODE:-true}
      NODE_ENV: ${NODE_ENV:-development}
      TZ: ${TZ:-UTC}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://mo_farm:change_me@db:5432/mo_farm}
      SESSION_SECRET: ${SESSION_SECRET:-change_me_minimum_32_chars}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27.1-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["init"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/src/migrate.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mo_farm:change_me@db:5432/mo_farm}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  seed:
    profiles: ["init"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/src/seed.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mo_farm:change_me@db:5432/mo_farm}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  cloudflared:
    profiles: ["public"]
    image: cloudflare/cloudflared:2025.9.1
    command: tunnel --no-autoupdate run --token $${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN for public profile}
    depends_on:
      nginx:
        condition: service_healthy
    networks: [frontend]

volumes:
  mo_farm_db:

networks:
  frontend:
  backend:
